name: Secret scan
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify scanner download and scan public history
        shell: bash
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          version=8.30.1
          base="https://api.github.com/repos/gitleaks/gitleaks/releases/assets"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 120 -H "Accept: application/octet-stream" "$base/378333193" -o "$dir/checksums.txt"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 120 -H "Accept: application/octet-stream" "$base/378332058" -o "$dir/gitleaks_${version}_linux_x64.tar.gz"
          (cd "$dir" && grep " gitleaks_${version}_linux_x64.tar.gz$" checksums.txt | sha256sum --check)
          tar -xzf "$dir/gitleaks_${version}_linux_x64.tar.gz" -C "$dir"
          "$dir/gitleaks" git . --redact --no-banner --log-opts="--all"
